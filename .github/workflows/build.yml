name: Build MD OS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk MD-OS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MD-OS-apk
          path: MD-OS.apk
      - name: Publish as the "latest" release (direct APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MD-OS.apk --target "$GITHUB_SHA" --prerelease \
            --title "MD OS (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install MD-OS.apk on your phone, then see the README for the Android Auto setup."
