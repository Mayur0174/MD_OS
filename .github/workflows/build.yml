name: Build MD OS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mv app/build/outputs/apk/release/app-release.apk MD-OS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MD-OS-apk
          path: MD-OS.apk
      - name: Publish as the "latest" release (direct APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest MD-OS.apk --target "$GITHUB_SHA" --prerelease \
            --title "MD OS (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install MD-OS.apk on your phone, then see the README for the Android Auto setup."

  # Runs the real car-screen renderer in an Android emulator, opens every service and publishes
  # screenshots + a JSON report as the "test-report" release.
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c || true
            nohup sh -c 'adb logcat -v time MdOsTest:V MdOs:V MdOsCar:V MdOsSpeed:V AndroidRuntime:E TestRunner:V DEBUG:V libc:F lowmemorykiller:V ActivityManager:I *:F > logcat.txt 2>&1' > /dev/null 2>&1 &
            nohup sh -c 'while true; do timeout 30 adb exec-out run-as com.mdos.auto tar c files/report > r.tmp 2>/dev/null && [ -s r.tmp ] && mv r.tmp report.tar; sleep 20; done' > /dev/null 2>&1 &
            timeout 1200 adb shell am instrument -w -e class com.mdos.auto.CarScreenTest com.mdos.auto.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || echo "instrument exit/timeout $?" >> instrument.txt
            timeout 60 adb exec-out run-as com.mdos.auto tar c files/report > r.tmp 2>/dev/null && [ -s r.tmp ] && mv r.tmp report.tar || true
            timeout 30 adb shell dumpsys meminfo com.mdos.auto > meminfo.txt 2>&1 || true
      - name: Package report
        if: always()
        run: |
          mkdir -p report && (tar xf report.tar -C report || true)
          cp instrument.txt logcat.txt meminfo.txt report/ 2>/dev/null || true
          cat instrument.txt || true
          tail -60 logcat.txt || true
          cat report/files/report/progress.txt 2>/dev/null || true
          cat report/files/report/report.json 2>/dev/null || echo "no report.json"
          cd report && zip -qr ../test-report.zip . && cd ..
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-report.zip
      - name: Publish report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-report --cleanup-tag -y || true
          gh release create test-report test-report.zip --target "$GITHUB_SHA" --prerelease \
            --title "MD OS emulator test report" --notes "Screenshots and page checks from the emulator run of ${GITHUB_SHA::7}."
